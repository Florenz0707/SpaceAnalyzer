minimum_pre_commit_version: '4.0.0'
default_stages: [pre-commit]
exclude: ^(\.agents/skills/|frontend/pnpm-lock\.yaml|backend/uv\.lock)
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier format
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --config .prettierrc.json --ignore-path .prettierignore --write
        language: system
        files: \.(json|ya?ml|md|[cm]?js|jsx|ts|tsx|css|html)$
      - id: markdownlint
        name: markdownlint format and lint
        entry: node frontend/node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs --config .markdownlint-cli2.yaml --fix
        language: system
        types: [markdown]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend --frozen ruff format --config backend/pyproject.toml
        language: system
        types: [python]
      - id: ruff-check
        name: ruff lint
        entry: uv run --project backend --frozen ruff check --config backend/pyproject.toml
        language: system
        types: [python]
      - id: eslint
        name: eslint check
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: pyright check
        entry: uv run --project backend --frozen pyright --project backend/pyproject.toml
        language: system
        pass_filenames: false
        always_run: true
      - id: pycompile
        name: pycompile check
        entry: uv run --project backend --frozen python -m compileall -q backend/src backend/tests
        language: system
        pass_filenames: false
        always_run: true
      - id: backend-tests
        name: backend tests
        entry: uv run --project backend --frozen pytest backend/tests
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-tests
        name: frontend tests
        entry: pnpm --dir frontend test
        language: system
        pass_filenames: false
        always_run: true
      - id: pnpm-build
        name: pnpm build
        entry: pnpm --dir frontend build
        language: system
        pass_filenames: false
        always_run: true
